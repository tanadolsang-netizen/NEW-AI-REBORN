workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    environment:
      node: latest
    scripts:
      - cd frontend
      - npm install
      - npm run build
      - npx cap sync android
    artifacts:
      - frontend/android/**/*.apk
      - frontend/android/**/*.aab

  ios-build:
    name: iOS Build
    max_build_duration: 30
    environment:
      node: latest
      xcode: "16.0"
    scripts:
      - cd frontend
      - npm install
      - npm run build
      - npx cap sync ios
    artifacts:
      - frontend/ios/**/*.ipa
